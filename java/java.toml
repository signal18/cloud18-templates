# Java application on the public maven:3.9-eclipse-temurin-21 image: Java 21 application built with Maven at start (MariaDB Connector/J, the JDK http server).
# The code is cloned from git by an init container and mounted on /app: replace the sample
# repository with your own. The sample page answers "Hello world, I'm connected to database
# server id N" through the cluster's proxy. The schema, user and password are created by the
# cluster at provision (app.db.* keys, app-db-auto-create), never on an existing schema or user.
app-host = "{{app.name}}"
app-port = "8080"
app-db-auto-create = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-cmd = "sh -c \"cd /app && mvn -q -B -DskipTests package && exec java -jar target/app.jar\""
prov-app-docker-img = "maven:3.9-eclipse-temurin-21"
prov-app-ha-topology = "flex"
prov-app-memory = "2048"
prov-app-start-timeout = "10m"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/app/"
    level = 0
    name = "path-git-cloud18-git-sample-data"
    parentname = ""
    srcname = "cloud18-git-sample-data"
    srcpath = "var/cloud18-git-sample-data/java/"
    srctype = "git"
    volumename = "local-data-directory"
  [[deployment.routes]]
    cname = "{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io"
    port = "{{app.port}}"
    primary = true
    protocol = "https"
  [deployment.storages]
    [[deployment.storages.git-clones]]
      branch = "main"
      name = "cloud18-git-sample-data"
      pass = ""
      repo = "github.com/signal18/cloud18-template-code.git"
      timeout = 0
      user = ""
      volumedir = "var/cloud18-git-sample-data"
      volumename = "local-data-directory"
    [[deployment.storages.volumes]]
      name = "local-data-directory"
      poolname = "tank"
      volumedir = "var"
  [[deployment.variables]]
    locked = false
    name = "DB_HOST"
    type = "env"
    value = "{{proxies.0.name}}"
  [[deployment.variables]]
    locked = false
    name = "DB_PORT"
    type = "env"
    value = "{{proxies.0.writePort}}"
  [[deployment.variables]]
    locked = false
    name = "DB_NAME"
    type = "env"
    value = "{{app.db.schema}}"
  [[deployment.variables]]
    locked = false
    name = "DB_USER"
    type = "env"
    value = "{{app.db.user}}"
  [[deployment.variables]]
    locked = false
    name = "DB_PASSWORD"
    type = "secret"
    value = "{{app.db.password}}"
