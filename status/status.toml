# Status: Uptime Kuma 2 monitoring every internal address of the cluster (namespace), kept up
# to date from replication-manager. One instance, failover topology; Kuma's state (monitors,
# history, users) is in the cluster's MariaDB through the proxy: the schema, user and password
# are created by the cluster at provision (app.db.* keys, app-db-auto-create).
#
# kuma-sync (cloned from cloud18-template-code/status, started next to Kuma by start.sh) reads
# the cluster's apps, database servers and proxies from the replication-manager API every
# SYNC_INTERVAL seconds and keeps one Kuma monitor per internal address: an app on each http
# route the way replication-manager checks it (the route monitor's path and expected status,
# on the app's internal host and port), a tcp route or an app without route on its port, a
# database server on its port, a proxy on its write and read ports. It adds, changes and
# removes only the monitors it created (description "managed by kuma-sync (<cluster>)");
# monitors added in Kuma by hand are left alone. A failed API read changes nothing.
#
# REPMAN_API_URL and REPMAN_API_TOKEN come from replication-manager ({{app.api.url}},
# {{app.api.token}}, replication-manager #2158; the URL is replication-manager's internal address,
# its certificate self-signed: REPMAN_API_TLS_VERIFY = false): the token is minted when the app is added,
# read-only and scoped to this cluster, listed in the admin user's API tokens, renewed at
# provision before it expires and revoked when the app is removed. KUMA_ADMIN_PASSWORD is
# the admin created at the first start (the sync does Kuma's setup and uses it).
#
# SSO: with OIDC_CLIENT_SECRET set (the identity provider's client OIDC_CLIENT_ID, redirect
# SSO_REDIRECT_URL), oauth2-proxy guards the page and sends straight to the Cloud18 login;
# only the cluster's users holding cluster-show-routes in replication-manager get in (the
# sync reads them every SYNC_INTERVAL), and Kuma's own login is off. Without the secret,
# Kuma's own login (KUMA_ADMIN_USER / KUMA_ADMIN_PASSWORD) guards the page.
#
# Status page: with STATUS_PAGE_SLUG set (letters, digits, dashes; empty = none), the sync keeps
# a read-only Kuma status page of its monitors (applications, databases, proxies) titled
# STATUS_PAGE_TITLE. Behind the SSO only that page's data stays open (monitor names and up/down,
# no address), so a page elsewhere (the Cloud18 members zone) can show it.
#
# External monitors: EXTERNAL_MONITORS ("name|https://url;name|url", empty = none) adds one http
# check per address outside the cluster (certificate verified), grouped as Partner consoles on
# the status page.
app-host = "{{app.name}}"
app-port = "3001"
app-db-auto-create = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-cmd = "sh /sync/start.sh"
prov-app-docker-img = "louislam/uptime-kuma:2.5.6"
prov-app-ha-topology = "failover"
prov-app-memory = "{{config.provAppMemory}}"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/sync/"
    level = 0
    name = "path-git-status-sync"
    parentname = ""
    srcname = "status-sync"
    srcpath = "var/status-sync/status/"
    srctype = "git"
    volumename = "local-data-directory"
  [[deployment.routes]]
    cname = "{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io"
    port = "{{app.port}}"
    primary = true
    protocol = "https"
    [deployment.routes.monitor]
      path = "/api/entry-page"
      expect-status = "200"
  [deployment.storages]
    [[deployment.storages.git-clones]]
      branch = "app-api-token-2158"
      name = "status-sync"
      pass = ""
      repo = "github.com/signal18/cloud18-template-code.git"
      timeout = 0
      user = ""
      volumedir = "var/status-sync"
      volumename = "local-data-directory"
    [[deployment.storages.volumes]]
      name = "local-data-directory"
      poolname = "tank"
      volumedir = "var"
  [[deployment.variables]]
    locked = true
    name = "UPTIME_KUMA_DB_TYPE"
    type = "env"
    value = "mariadb"
  [[deployment.variables]]
    locked = false
    name = "UPTIME_KUMA_DB_HOSTNAME"
    type = "env"
    value = "{{proxies.0.name}}"
  [[deployment.variables]]
    locked = false
    name = "UPTIME_KUMA_DB_PORT"
    type = "env"
    value = "{{proxies.0.writePort}}"
  [[deployment.variables]]
    locked = false
    name = "UPTIME_KUMA_DB_NAME"
    type = "env"
    value = "{{app.db.schema}}"
  [[deployment.variables]]
    locked = false
    name = "UPTIME_KUMA_DB_USERNAME"
    type = "env"
    value = "{{app.db.user}}"
  [[deployment.variables]]
    locked = false
    name = "UPTIME_KUMA_DB_PASSWORD"
    type = "secret"
    value = "{{app.db.password}}"
  [[deployment.variables]]
    locked = false
    name = "KUMA_ADMIN_USER"
    type = "env"
    value = "admin"
  [[deployment.variables]]
    locked = false
    name = "KUMA_ADMIN_PASSWORD"
    type = "secret"
    value = "{{app.randompassword}}"
  [[deployment.variables]]
    locked = false
    name = "REPMAN_API_URL"
    type = "env"
    value = "{{app.api.url}}"
  [[deployment.variables]]
    locked = false
    name = "REPMAN_API_TOKEN"
    type = "secret"
    value = "{{app.api.token}}"
  [[deployment.variables]]
    locked = false
    name = "REPMAN_API_TLS_VERIFY"
    type = "env"
    value = "false"
  [[deployment.variables]]
    locked = false
    name = "OIDC_ISSUER_URL"
    type = "env"
    value = "https://identity.cloud18.io/realms/cloud18"
  [[deployment.variables]]
    locked = false
    name = "OIDC_CLIENT_ID"
    type = "env"
    value = "{{app.name}}-{{name}}"
  [[deployment.variables]]
    locked = false
    name = "OIDC_CLIENT_SECRET"
    type = "secret"
    value = ""
  [[deployment.variables]]
    locked = false
    name = "SSO_REDIRECT_URL"
    type = "env"
    value = "https://{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io/oauth2/callback"
  [[deployment.variables]]
    locked = false
    name = "REPMAN_CLUSTER"
    type = "env"
    value = "{{name}}"
  [[deployment.variables]]
    locked = false
    name = "SELF_HOST"
    type = "env"
    value = "{{app.name}}.{{name}}.svc.cloud18"
  [[deployment.variables]]
    locked = false
    name = "SYNC_INTERVAL"
    type = "env"
    value = "60"
  [[deployment.variables]]
    locked = false
    name = "STATUS_PAGE_SLUG"
    type = "env"
    value = ""
  [[deployment.variables]]
    locked = false
    name = "STATUS_PAGE_TITLE"
    type = "env"
    value = ""
  [[deployment.variables]]
    locked = false
    name = "EXTERNAL_MONITORS"
    type = "env"
    value = ""
