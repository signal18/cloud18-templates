# RustFS, S3 object storage (Apache 2.0, MinIO compatible) with single sign-on: the cluster's S3 provider. One
# instance that owns its data volume, failover topology. The S3 API answers on {{app.name}}.{{name}}.svc.cloud18:9000
# inside the cluster network only, the web console is on the https route under the path /rustfs/console/ (the
# route's root answers the S3 API: 403 AccessDenied is normal there). Stateful (DBU) and S3 provider (its volume is
# producer BAU). The root secret is a plain default, change it at add time; other apps mount its buckets through
# s3-mounts.
#
# SSO: people log in to the console through an OpenID Connect provider (GitLab, Forgejo, ...), and S3 clients trade
# the provider's identity token at RustFS's STS (AssumeRoleWithWebIdentity, at the S3 API root) for short-lived keys.
# Set at add time:
#   - RUSTFS_IDENTITY_OPENID_CONFIG_URL: the provider's issuer URL, exactly as its discovery document declares it
#     (no trailing slash: RustFS compares the two);
#   - RUSTFS_IDENTITY_OPENID_CLIENT_ID / _CLIENT_SECRET: an OAuth2 application of the provider whose redirect URI is
#     RUSTFS_IDENTITY_OPENID_REDIRECT_URI below.
# Rights come from two token claims, each naming a RustFS policy that must exist (RustFS 1.0.3 resolves no policy
# variable such as ${jwt:sub} for SSO sessions, so each policy holds literal resources):
#   - sub (RUSTFS_IDENTITY_OPENID_CLAIM_NAME): the policy named after the user id gives the user's own buckets, e.g.
#     policy "42" for user ahmad:
#       {"Version":"2012-10-17","Statement":[
#         {"Effect":"Allow","Action":["s3:ListAllMyBuckets","s3:GetBucketPolicyStatus","s3:CreateBucket"],
#          "Resource":["arn:aws:s3:::*"]},
#         {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads",
#          "s3:DeleteBucket"],"Resource":["arn:aws:s3:::ahmad","arn:aws:s3:::ahmad-*"]},
#         {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload",
#          "s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::ahmad/*","arn:aws:s3:::ahmad-*/*"]}]}
#   - groups (RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM): the policy named after each group (a GitLab group, a Forgejo
#     organisation) gives the group's buckets: the same bucket and object statements on "<group>" and "<group>-*".
# RustFS combines both in one login; a group without a policy is ignored. The policies are created by an admin or a
# job that follows the provider's users and groups. Without its policy a user gets no access at all.
# A provider on a private address (inside the cluster) also needs RUSTFS_OUTBOUND_ALLOW_ORIGINS set to its origin
# (scheme://host:port, no path): RustFS refuses outbound requests to private addresses otherwise.
# Users who approved the OAuth2 application before the groups scope was requested get no groups claim until they
# revoke that approval once in the provider (the provider reuses the old approval silently).
app-host = "{{app.name}}"
app-port = "9000"
app-stateful = true
app-s3-provider = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-memory = "{{config.provAppMemory}}"
prov-app-docker-img = "rustfs/rustfs:latest"
prov-app-ha-topology = "failover"

[deployment]
  [deployment.Mutex]

  [[deployment.paths]]
    dockerpath = "/data"
    level = 0
    name = "path-volume-rustfs-data"
    parentname = ""
    srcname = "rustfs-data"
    srcpath = "data/"
    srctype = "volume"
    volumename = "rustfs-data"

  [[deployment.routes]]
    cname = "{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io"
    port = "9001"
    primary = true
    protocol = "https"
    # the route's root is the S3 API and answers 403 AccessDenied to an anonymous GET; the
    # monitor must read the health endpoint, or the app flaps Suspect/Failed every half hour
    # (curepipe rustfs1, 2026-10-07)
    [deployment.routes.monitor]
      path = "/health"
      expect-status = "200"

  [deployment.storages]
    [[deployment.storages.volumes]]
      name = "rustfs-data"
      poolname = "drbd"
      volumedir = "data"
      user = "10001"
      group = "10001"
      dirperm = "0750"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_ACCESS_KEY"
    type = "env"
    value = "admin"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_SECRET_KEY"
    type = "secret"
    value = "rustfsadmin-change-me"

  [[deployment.variables]]
    locked = true
    name = "RUSTFS_VOLUMES"
    type = "env"
    value = "/data"

  [[deployment.variables]]
    locked = true
    name = "RUSTFS_ADDRESS"
    type = "env"
    value = "0.0.0.0:9000"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_CONSOLE_ENABLE"
    type = "env"
    value = "true"

  [[deployment.variables]]
    locked = true
    name = "RUSTFS_CONSOLE_ADDRESS"
    type = "env"
    value = "0.0.0.0:9001"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_REGION"
    type = "env"
    value = "eu-west-1"

  [[deployment.variables]]
    locked = true
    name = "RUSTFS_IDENTITY_OPENID_ENABLE"
    type = "env"
    value = "on"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_CONFIG_URL"
    type = "env"
    value = "https://gitlab.example.com"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_CLIENT_ID"
    type = "env"
    value = "gitlab-application-id-change-me"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_CLIENT_SECRET"
    type = "secret"
    value = "gitlab-application-secret-change-me"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_SCOPES"
    type = "env"
    value = "profile,email,groups"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM"
    type = "env"
    value = "preferred_username"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM"
    type = "env"
    value = "email"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_CLAIM_NAME"
    type = "env"
    value = "sub"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM"
    type = "env"
    value = "groups"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_DISPLAY_NAME"
    type = "env"
    value = "Cloud18 GitLab"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_BROWSER_REDIRECT_URL"
    type = "env"
    value = "https://{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io"

  [[deployment.variables]]
    locked = false
    name = "RUSTFS_IDENTITY_OPENID_REDIRECT_URI"
    type = "env"
    value = "https://{{app.name}}.{{name}}.{{config.cloud18SubDomain}}-{{config.cloud18SubDomainZone}}.{{config.cloud18Domain}}.cloud18.io/rustfs/admin/v3/oidc/callback/default"

  [[deployment.variables]]
    locked = true
    name = "RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC"
    type = "env"
    value = "off"
