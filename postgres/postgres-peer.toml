# PostgreSQL peer: a second independent PostgreSQL instance of the cluster, for logical
# replication (replication-master-slave-pg-logical). Same service as the postgres template,
# its superuser password being the one generated for the cluster's first PostgreSQL app, so
# the monitor uses one credential for both.
app-host = "{{app.name}}"
app-port = "5432"
app-stateful = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-configurator = "postgres"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-cmd = "bash -c \"printenv APP_START_SCRIPT > /tmp/app_start && exec bash /tmp/app_start\""
prov-app-docker-img = "postgres:17"
prov-app-ha-topology = "failover"
prov-app-memory = "{{config.provAppMemory}}"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/var/lib/postgresql/data"
    level = 0
    name = "path-volume-postgres-data"
    parentname = ""
    srcname = "postgres-data"
    srcpath = "data/"
    srctype = "volume"
    volumename = "postgres-data"
  [deployment.storages]
    [[deployment.storages.volumes]]
      name = "postgres-data"
      # the cluster places a replicated member on ONE agent and its volume on the
      # cluster's data pool (prov-db-volume-data): own data, no failover move; drbd
      # here is the template default, replaced at render (replication-manager #1925)
      poolname = "drbd"
      volumedir = "data"
  [[deployment.variables]]
    locked = false
    name = "POSTGRES_PASSWORD"
    type = "secret"
    value = "{{apps.#(config.provAppConfigurator==postgres).randompassword}}"
  [[deployment.variables]]
    locked = true
    name = "PGDATA"
    type = "env"
    value = "/var/lib/postgresql/data/pgdata"
