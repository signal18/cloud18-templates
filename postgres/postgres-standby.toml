# PostgreSQL standby of the cluster's primary (WAL streaming). Same service as the postgres
# template, plus PG_PRIMARY_HOST: at its first start, with an empty data directory, the
# start script copies the primary online (pg_basebackup -R) and the instance then follows
# it. The primary is the first monitored server of the cluster when the app is added.
# Declare it next to the primary (db-servers-hosts = "pg1:5432/postgres,pg2:5432/postgres",
# replication-master-slave-pg-stream = true). Its superuser is the cluster's
# database credential, like the primary's.
app-host = "{{app.name}}"
app-port = "5432"
app-stateful = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-configurator = "postgres"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-cmd = "bash -c \"printenv APP_START_SCRIPT > /tmp/app_start && exec bash /tmp/app_start\""
prov-app-docker-img = "postgres:17"
prov-app-ha-topology = "failover"
prov-app-memory = "{{config.provAppMemory}}"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/var/lib/postgresql/data"
    level = 0
    name = "path-volume-postgres-data"
    parentname = ""
    srcname = "postgres-data"
    srcpath = "data/"
    srctype = "volume"
    volumename = "postgres-data"
  [deployment.storages]
    [[deployment.storages.volumes]]
      name = "postgres-data"
      poolname = "drbd"
      volumedir = "data"
  [[deployment.variables]]
    locked = false
    name = "PG_PRIMARY_HOST"
    type = "env"
    value = "{{servers.0.host}}"
  [[deployment.variables]]
    locked = false
    name = "PG_PRIMARY_PORT"
    type = "env"
    value = "{{servers.0.port}}"
  [[deployment.variables]]
    locked = true
    name = "PGDATA"
    type = "env"
    value = "/var/lib/postgresql/data/pgdata"
