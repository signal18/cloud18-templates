# PostgreSQL primary next to (or as) the cluster's database: one instance that owns its data,
# failover topology, the data volume moves with it. replication-manager delivers what runs
# in the container (prov-app-configurator = postgres):
#   - the start script: memory and autovacuum settings rendered from the app plan (the
#     postgres moduleset, sized on prov-app-memory, prov-app-cpu-cores, prov-app-disk-iops),
#     written at every start, so a resize followed by a restart re-tunes it; replication
#     connections allowed for standbys;
#   - the jobs sidecar: logical and physical backups, optimize, usage report.
# Declared as the server of a cluster (db-servers-hosts = "<app>:5432/postgres") it is
# monitored by replication-manager. Add standbys with the postgres-standby template.
# Reachable from the cluster network only (no route). Its superuser is the cluster's
# database credential (db-servers-credential), delivered by replication-manager: set it
# before provisioning, the shipped default is refused.
app-host = "{{app.name}}"
app-port = "5432"
app-stateful = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-configurator = "postgres"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-cmd = "bash -c \"printenv APP_START_SCRIPT > /tmp/app_start && exec bash /tmp/app_start\""
prov-app-docker-img = "postgres:17"
prov-app-ha-topology = "failover"
prov-app-memory = "{{config.provAppMemory}}"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/var/lib/postgresql/data"
    level = 0
    name = "path-volume-postgres-data"
    parentname = ""
    srcname = "postgres-data"
    srcpath = "data/"
    srctype = "volume"
    volumename = "postgres-data"
  [deployment.storages]
    [[deployment.storages.volumes]]
      name = "postgres-data"
      poolname = "drbd"
      volumedir = "data"
  [[deployment.variables]]
    locked = true
    name = "PGDATA"
    type = "env"
    value = "/var/lib/postgresql/data/pgdata"
