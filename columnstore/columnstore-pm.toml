# MariaDB ColumnStore PM of a ColumnStore cluster (replication-manager #2002): one node of the
# ColumnStore cluster whose UM is the cluster's database server. Failover topology: one
# instance that owns its data, the DRBD volume moves with it to the other node on a node
# loss, and CMAPI sees the same PM come back. An app because the monitor does not track
# PMs, but part of the database: it gets the cluster's root password like the UM
# (prov-app-db-credentials). The image starts ColumnStore's processes before the server
# (signal18/mariadb-columnstore, docker/columnstore in replication-manager).
# /dev/shm on a volume of the OpenSVC shm pool (replication-manager #2007): ColumnStore keeps its
# BRM in shared memory, and Docker's 64 MB default is 87% used by a 2-node cluster (a third
# node's load_brm failed, No space left on device). Local to each node, the BRM is reloaded
# from the data volume at start; 1 GB is the cap, not a reservation. dirperm 777, not 1777:
# a remounted tmpfs loses the sticky bit and the failover service goes warn.
# Reachable from the cluster network only (no route): ColumnStore inter-node ports
# 8600-8630, 8700, 8800 and CMAPI 8640 on the PM's service address.
app-host = "{{app.name}}"
app-port = "3306"
app-stateful = true
prov-app-agents = "{{config.provAppAgents}}"
prov-app-cpu-cores = "{{config.provAppCpuCores}}"
prov-app-db-credentials = true
prov-app-disk-size = "{{config.provAppDiskSize}}"
prov-app-docker-img = "signal18/mariadb-columnstore:11.8"
prov-app-ha-topology = "failover"
prov-app-memory = "{{config.provAppMemory}}"
[deployment]
  [deployment.Mutex]
  [[deployment.paths]]
    dockerpath = "/var/lib/mysql"
    level = 0
    name = "path-volume-columnstore-mysql"
    parentname = ""
    srcname = "columnstore-data"
    srcpath = "mysql/"
    srctype = "volume"
    volumename = "columnstore-data"
  [[deployment.paths]]
    dockerpath = "/var/lib/columnstore"
    level = 0
    name = "path-volume-columnstore-dbroot"
    parentname = ""
    srcname = "columnstore-data"
    srcpath = "columnstore/"
    srctype = "volume"
    volumename = "columnstore-data"
  [[deployment.paths]]
    dockerpath = "/etc/columnstore"
    level = 0
    name = "path-volume-columnstore-etc"
    parentname = ""
    srcname = "columnstore-data"
    srcpath = "columnstore-etc/"
    srctype = "volume"
    volumename = "columnstore-data"
  [[deployment.paths]]
    dockerpath = "/dev/shm"
    level = 0
    name = "path-volume-columnstore-shm"
    parentname = ""
    srcname = "columnstore-shm"
    srcpath = "shm/"
    srctype = "volume"
    volumename = "columnstore-shm"
  [deployment.storages]
    [[deployment.storages.volumes]]
      name = "columnstore-data"
      poolname = "drbd"
      volumedir = "mysql columnstore columnstore-etc"
    [[deployment.storages.volumes]]
      name = "columnstore-shm"
      poolname = "shm"
      size = "1"
      volumedir = "shm"
      user = "999"
      group = "999"
      dirperm = "777"
